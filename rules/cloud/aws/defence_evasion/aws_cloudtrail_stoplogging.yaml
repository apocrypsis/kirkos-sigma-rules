title: 'Stop AWS CloudTrail Logging'
id: '4f10d703-90f1-4cfd-a3ca-e5e1199abe12'
logsource:
  product: 'aws'
  service: 'cloudtrail'
description: |
  Detects when CloudTrail logging is stopped, 
  which can be an indicator of malicious activity or an attempt to evade detection.
detection:
  cloudtrail_disable_action:
    eventSource: 'cloudtrail.amazonaws.com'
    eventName: 'StopLogging'
  condition: 'cloudtrail_disable_action'
level: 'high'
tags:
  - 'attack.defence-evasion'
  - 'attack.t1562'
  - 'attack.t1562.008'