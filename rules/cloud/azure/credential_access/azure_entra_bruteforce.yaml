title: 'Entra Failed Login Event'
id: 'd66d121b-c1cb-4a17-8338-b7e40de23944'
author: '@apocrypsis'
name: 'entra_failed_login' # Rule reference; doesn't work with rsigma backtests. Only `id` field does.
description: |
  This rule detects a single failed signin attempt to Entra.
  Intended to be used only as a base rule, for correlation. Should not be used on its own.
logsource:
  product: 'azure'
  service: 'entra'
detection:
  entra_failed_login_event:
    category: 'SignInLogs'
    operationName: 'Sign-in activity'
    resultType: '50126'
  condition: 'entra_failed_login_event'
# Don't alert on one failed login.

---
title: 'Multiple Failed Login Attempts in Entra (Potential Bruteforcing)'
id: '329fd625-5495-4367-9c82-0da65ad1a9f7'
description: |
  This rule detects repeated authentication failures for a single user account
  in a short duration of time.
  This is quite a naive rule, intended mostly to demonstrate 
  use of the Sigma correlation feature.
correlation:
  type: 'event_count'
  rules:
    - 'd66d121b-c1cb-4a17-8338-b7e40de23944' # entra_failed_login
  group-by:
    - 'properties.userId' 
  timespan: 5m
  condition:
    gte: 15
level: 'medium'
